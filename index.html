<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Veilfall: Wardens of the Rift</title><link rel="stylesheet" href="style.css"></head><body>
<section id="title"><h1>VEILFALL</h1><p class="sub">Wardens of the Rift</p><div class="fan" id="fan"></div>
<button id="start" class="primary">Start duel</button>
<p class="how">Spend mana to play creatures and spells. Click a ready creature, then an enemy to attack. Guard creatures must be hit first. Bring the enemy Ward from 20 to 0.</p></section>
<section id="game" class="hidden">
<aside><div class="side"><div class="who">Rift Warden (AI)</div><div id="oward" class="ward" data-target="ward"></div><div class="meta" id="ometa"></div></div>
<div class="center"><div id="turn"></div><div id="hint"></div><button id="end" class="primary">End Turn</button><button id="restart" class="ghost">Restart</button></div>
<div class="side"><div class="who">You, Veil Warden</div><div id="pward" class="ward"></div><div class="meta" id="pmeta"></div><div class="mana" id="pmana"></div></div></aside>
<main><div id="ohand" class="row"></div><div id="oboard" class="row board"></div><div id="pboard" class="row board"></div><div id="phand" class="row"></div></main></section>
<div id="end-screen" class="hidden"><div class="panel"><h2 id="endTitle"></h2><p id="endText"></p><button id="again" class="primary">Play again</button></div></div>
<div id="fx"></div>
<script src="cards.js"></script><script src="art.js"></script><script src="game.js"></script></body></html>
